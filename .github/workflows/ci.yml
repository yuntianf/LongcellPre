name: Package CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-r44:
    name: Linux R 4.4 / Bioconductor 3.20
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      _R_CHECK_FORCE_SUGGESTS_: 'false'
      TZ: UTC
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore validated dependencies and mapping tools
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: longcell-ci
          environment-file: .github/ci/environment-linux-64.lock
          cache-environment: true
          cache-environment-key: longcell-r44-${{ hashFiles('.github/ci/source-dependencies.json') }}
          init-shell: none
          generate-run-shell: true

      - name: Install verified source dependencies
        run: python .github/ci/install-source-deps.py

      - name: Build, check, install and verify exact native outputs
        run: python .github/ci/run-checks.py

      - name: Retain check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-check-logs-${{ github.run_id }}
          path: |
            ci-output/*.log
            ci-output/*.json
            ci-output/*.rds
            ci-output/*.txt
            ci-output/*.csv
            ci-output/*.Rcheck/00check.log
            ci-output/*.Rcheck/tests/*.Rout*
          if-no-files-found: warn
          retention-days: 30

      - name: Deliver the checked source package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LongcellPre-source-${{ github.sha }}
          path: |
            ci-output/LongcellPre_*.tar.gz
            ci-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
